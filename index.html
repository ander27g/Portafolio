<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Portafolio de Anderson, desarrollador y creativo.">
    <title>Portafolio Anderson - Pixel Art</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/script.js" defer></script>
</head>
<body>
    <!-- El gnomo se queda fuera del contenedor para que siempre esté en pantalla -->
    <div class="gnomo" id="gnomo" aria-hidden="true"></div>

    <!-- Contenedor fijo que ocupa la pantalla -->
    <main class="marco-pantalla">
        <!-- Contenedor muy ancho que se deslizará horizontalmente -->
        <div class="universo-horizontal" id="universo-horizontal">
            
            <section id="presentacion" class="seccion">
                <div class="contenido-caja">
                    <h1>¡Hola! Soy Anderson</h1>
                    <p>Bienvenido a mi aventura creativa.</p>
                </div>
            </section>
            
            <div class="espacio-transicion" aria-hidden="true"></div>

            <section id="habilidades" class="seccion">
                <div class="contenido-caja">
                    <h2>Mis Habilidades</h2>
                    <p>El arsenal de mi inventario.</p>
                </div>
            </section>

            <div class="espacio-transicion" aria-hidden="true"></div>

            <section id="portafolio" class="seccion">
                <div class="contenido-caja">
                    <h2>Mis Proyectos</h2>
                    <p>Las misiones que he completado.</p>
                </div>
            </section>

            <div class="espacio-transicion" aria-hidden="true"></div>

            <section id="final" class="seccion">
                <div class="contenido-caja">
                    <h2>Hablemos, Contáctame</h2>
                    <p>Este es el fin de mi viaje.</p>
                </div>
            </section>

        </div>
    </main>
</body>
</html>
